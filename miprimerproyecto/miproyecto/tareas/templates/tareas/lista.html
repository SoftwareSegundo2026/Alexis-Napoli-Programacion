<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis tareas</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #eeeae2;
            margin: 0;
            padding: 60px 20px;
            color: #1c1c1c;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            border-bottom: 3px solid #1c1c1c;
            padding-bottom: 14px;
            margin-bottom: 36px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: #6b6b6b;
        }

        .tarea {
            position: relative;
            padding: 18px 0 18px 32px;
            border-bottom: 1px solid #d8d3c8;
        }

        .tarea:last-child {
            border-bottom: none;
        }

        .tarea::before {
            content: "";
            position: absolute;
            left: 0;
            top: 24px;
            width: 8px;
            height: 8px;
            background-color: #d1531f;
            border-radius: 1px;
            transform: rotate(45deg);
        }

        .tarea h2 {
            margin: 0 0 6px 0;
            font-size: 1.15rem;
            font-weight: 500;
        }

        .tarea p {
            margin: 0 0 8px 0;
            color: #4a4a4a;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .tarea small {
            font-family: 'JetBrains Mono', monospace;
            color: #999;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .vacio {
            padding: 40px 0;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Mis tareas</h1>
            <span class="count">{{ tareas|length }} activas</span>
        </div>

        {% for tarea in tareas %}
            <div class="tarea">
                <h2>{{ tarea.name }}</h2>
                <p>{{ tarea.description }}</p>
                <small>{{ tarea.date }}</small>
            </div>
        {% empty %}
            <p class="vacio">Todavía no cargaste ninguna tarea.</p>
        {% endfor %}
    </div>
</body>
</html>
