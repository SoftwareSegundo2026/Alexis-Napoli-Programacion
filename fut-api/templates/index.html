<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fut-API · Consulta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="cabecera">
    <div class="cabecera__marca">
      <span class="cabecera__logo">⚽</span>
      <span class="cabecera__titulo">FUT-API</span>
      <span class="cabecera__subtitulo">planilla de consulta</span>
    </div>
    <nav class="pestanias" id="pestanias">
      <button class="pestania pestania--activa" data-recurso="clubes">Clubes</button>
      <button class="pestania" data-recurso="jugadores">Jugadores</button>
      <button class="pestania" data-recurso="torneos">Torneos</button>
    </nav>
  </header>

  <main class="contenido">
    <section class="panel panel--lista">
      <div class="panel__encabezado">
        <h2 id="titulo-lista">Clubes</h2>
        <input
          type="search"
          id="buscador"
          class="buscador"
          placeholder="Buscar por nombre…"
          autocomplete="off"
        >
      </div>
      <ul class="lista" id="lista-resultados">
        <!-- Se llena dinámicamente desde app.js -->
      </ul>
    </section>

    <section class="panel panel--detalle" id="panel-detalle">
      <div class="detalle-vacio">
        <span class="detalle-vacio__icono">📋</span>
        <p>Elegí un elemento de la lista para ver el detalle.</p>
      </div>
    </section>
  </main>

  <footer class="pie">
    Fut-API — mini web de consulta · datos servidos desde <code>/paises</code>, <code>/clubes</code>, <code>/jugadores</code>, <code>/torneos</code> y afines
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
